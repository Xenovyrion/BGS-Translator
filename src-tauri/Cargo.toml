[package]
name = "bgs-translator"
version = "1.0.0"
description = "BGS Translator - Bethesda mod translation tool"
authors = ["Xenovyrion"]
edition = "2021"
license = "MPL-2.0"

[package.metadata]

[lib]
name = "bgs_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri                 = { version = "2", features = [] }
tauri-plugin-dialog   = "2"
tauri-plugin-fs       = "2"
tauri-plugin-opener   = "2"
tauri-plugin-updater  = "2"
tauri-plugin-log      = "2"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }

# Binary parsing
binrw       = "0.14"

# Compression (zlib for compressed records, zstd for .dlstrings)
flate2      = "1"

# Windows-1252 / UTF-8 encoding for legacy non-Unicode plugins
encoding_rs = "0.8"

# Database
bincode = "1"
zstd    = "0.13"
ahash   = "0.8"

# XML parsing
quick-xml = "0.36"

# Utilities
uuid    = { version = "1", features = ["v4"] }
chrono  = { version = "0.4", features = ["serde"] }
thiserror = "2"
log       = "0.4"

# Structured logging — "log" feature bridges tracing events to the log facade,
# which tauri-plugin-log captures without any change to the plugin setup.
tracing            = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Panic-free Mutex/RwLock (no poisoning, no unwrap needed on lock())
parking_lot = "0.12"

# Atomic file writes: write to a temp file then rename — safe against crash corruption
tempfile = "3"

# Wipe sensitive data (API keys) from RAM after use
zeroize = { version = "1", features = ["derive"] }

# Spell check — HTTP dictionary downloads (no OpenSSL, pure Rust TLS)
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "json"], default-features = false }

# Fuzzy text matching (Jaro-Winkler + normalized Levenshtein)
strsim = "0.11"

# Data-parallelism for fuzzy bulk search (run inside spawn_blocking)
rayon = "1"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc          = "1"

[target.'cfg(windows)'.build-dependencies]
vcpkg = "0.2"

[target.'cfg(not(windows))'.build-dependencies]
pkg-config = "0.3"
