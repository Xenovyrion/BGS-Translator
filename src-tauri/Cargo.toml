[package]
name = "bgs-translator"
version = "1.0.0"
description = "BGS Translator - Outil de traduction de mods Bethesda"
authors = []
edition = "2021"
license = "GPL-3.0"

[package.metadata]

[lib]
name = "bgs_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri                 = { version = "2", features = [] }
tauri-plugin-dialog   = "2"
tauri-plugin-fs       = "2"
tauri-plugin-opener   = "2"
tauri-plugin-updater  = "2"
tauri-plugin-log      = "2"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }

# Binary parsing
binrw       = "0.14"

# Compression (records compressés zlib + fichiers .dlstrings)
flate2      = "1"

# Encodage Windows-1252 / UTF-8 pour les vieux plugins non-Unicode
encoding_rs = "0.8"

# Base de données
bincode = "1"
zstd    = "0.13"
ahash   = "0.8"

# XML parsing
quick-xml = "0.36"

# Utilitaires
uuid    = { version = "1", features = ["v4"] }
chrono  = { version = "0.4", features = ["serde"] }
thiserror = "1"
log       = "0.4"

# Spell check — HTTP dictionary downloads (no OpenSSL, pure Rust TLS)
reqwest = { version = "0.12", features = ["rustls-tls", "stream"], default-features = false }

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc          = "1"

[target.'cfg(windows)'.build-dependencies]
vcpkg = "0.2"

[target.'cfg(not(windows))'.build-dependencies]
pkg-config = "0.3"
